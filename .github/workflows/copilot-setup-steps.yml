name: "Copilot Setup Steps"

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate visual baselines on this runner and upload them as an artifact
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    # This project has no `build` step: `tsx api/server.ts` runs the app and
    # `cucumber-js` runs the BDD suite, whose BeforeAll spawns its own server.
    - name: Run BDD test suite
      run: npm run test:bdd
      env:
        UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots && '1' || '' }}

    # Baselines are compared byte for byte, so they must come from this runner.
    # Download the artifact and commit it to tests/__screenshots__/chromium/linux/.
    - name: Upload regenerated visual baselines
      if: ${{ inputs.update_snapshots }}
      uses: actions/upload-artifact@v4
      with:
        name: visual-baselines-linux
        path: tests/__screenshots__/chromium/linux/
        retention-days: 7

    - name: Upload Cucumber report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cucumber-report
        path: |
          reports/cucumber-report.html
          reports/cucumber-report.json
        retention-days: 7
